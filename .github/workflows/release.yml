name: Release

# Publishes @zinejs/core and @zinejs/pdf to npm with provenance when you push a
# version tag (e.g. v1.0.0). Also runnable manually from the Actions tab.
#
# Auth is tokenless: npm Trusted Publishing (OIDC) is configured for this repo +
# workflow on npmjs.com, so no NPM_TOKEN secret is needed. Trusted publishing only
# activates for `npm publish` run from the package directory (not a tarball path),
# so each package is published in place. @zinejs/pdf's `workspace:^` dep is rewritten
# to the real version first (what pnpm would otherwise do at pack time).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing + provenance (Sigstore)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build here and publish with --ignore-scripts, so the prepublishOnly build does not
      # run twice. core builds first; pdf's declaration build resolves core from its dist.
      - name: Build
        run: |
          pnpm --filter @zinejs/core build
          pnpm --filter @zinejs/pdf build

      # Publish from the package directory so npm performs the OIDC exchange (tokenless).
      # Skip if the version is already on npm so re-runs are safe.
      - name: Publish @zinejs/core
        run: |
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "@zinejs/core@$V" version >/dev/null 2>&1; then
            echo "@zinejs/core@$V already on npm, skipping"; exit 0
          fi
          cd packages/core && npm publish --provenance --access public --ignore-scripts

      - name: Publish @zinejs/pdf
        run: |
          V=$(node -p "require('./packages/pdf/package.json').version")
          if npm view "@zinejs/pdf@$V" version >/dev/null 2>&1; then
            echo "@zinejs/pdf@$V already on npm, skipping"; exit 0
          fi
          node -e "const fs=require('fs');const p='packages/pdf/package.json';const j=JSON.parse(fs.readFileSync(p));const cv=require('./packages/core/package.json').version;for(const s of ['dependencies','devDependencies','peerDependencies','optionalDependencies']){const d=j[s];if(d)for(const k in d)if(String(d[k]).startsWith('workspace:'))d[k]='^'+cv;}fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('rewrote workspace deps to ^'+cv);"
          cd packages/pdf && npm publish --provenance --access public --ignore-scripts
