name: Release

# Publishes @zinejs/core and @zinejs/pdf to npm with provenance when you push a
# version tag (e.g. v1.0.0). Also runnable manually from the Actions tab.
#
# Tokenless auth via npm Trusted Publishing (OIDC), configured for this repo +
# release.yml on npmjs.com. Requirements (npm docs): id-token: write, npm >= 11.5.1,
# and `registry-url` set on setup-node so npm is pointed at the registry for the OIDC
# exchange. No NPM_TOKEN. @zinejs/pdf's `workspace:^` dep is rewritten to the real
# version before publishing (what pnpm would do at pack time).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance (Sigstore)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org' # required for the OIDC exchange
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build (published with --ignore-scripts so prepublishOnly does not build again), and
      # copy the root LICENSE into each package so the published tarball carries it.
      - name: Build
        run: |
          pnpm --filter @zinejs/core build
          pnpm --filter @zinejs/pdf build
          cp LICENSE packages/core/LICENSE
          cp LICENSE packages/pdf/LICENSE

      # Publish from the package directory (the flow trusted publishing hooks into). Skip if
      # the version is already on npm so re-runs are safe.
      - name: Publish @zinejs/core
        run: |
          V=$(node -p "require('./packages/core/package.json').version")
          if npm view "@zinejs/core@$V" version >/dev/null 2>&1; then
            echo "@zinejs/core@$V already on npm, skipping"; exit 0
          fi
          cd packages/core && npm publish --provenance --access public --ignore-scripts

      - name: Publish @zinejs/pdf
        run: |
          V=$(node -p "require('./packages/pdf/package.json').version")
          if npm view "@zinejs/pdf@$V" version >/dev/null 2>&1; then
            echo "@zinejs/pdf@$V already on npm, skipping"; exit 0
          fi
          node -e "const fs=require('fs');const p='packages/pdf/package.json';const j=JSON.parse(fs.readFileSync(p));const cv=require('./packages/core/package.json').version;for(const s of ['dependencies','devDependencies','peerDependencies','optionalDependencies']){const d=j[s];if(d)for(const k in d)if(String(d[k]).startsWith('workspace:'))d[k]='^'+cv;}fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('rewrote workspace deps to ^'+cv);"
          cd packages/pdf && npm publish --provenance --access public --ignore-scripts
