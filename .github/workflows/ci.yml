name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each package's `test` script runs `tsc --noEmit` then `vitest run`,
      # so this covers typechecking and the unit suites for core and pdf.
      # @zinejs/pdf typechecks @zinejs/core from source (tsconfig paths), so no build first.
      - name: Test
        run: pnpm -r test

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Each package's `size` script builds then checks its size-limit budgets,
      # enforcing the bundle gates (core entry + lazy chunks, pdf plugin).
      - name: Size limit
        run: pnpm -r size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the demo's Vite dev server (aliased to package source, no build)
      # and drives Chromium through the flip/gesture/interaction/perf specs.
      - name: E2E
        run: pnpm --filter @zinejs/demo test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/demo/playwright-report/
          retention-days: 7
