name: Deploy WordPress plugin

# Publishes the zinejs WordPress plugin to the WordPress.org SVN repository (trunk + a tag) and
# updates the listing assets (icon, banner, screenshots). Runs on a `wp-*` tag, e.g. `wp-1.0.0`.
#
# Prerequisites (one-time, after the plugin is APPROVED on WordPress.org):
#   1. The plugin slug `zinejs` is approved and SVN access is granted.
#   2. Repo secrets SVN_USERNAME and SVN_PASSWORD are set to your WordPress.org account.
# Until then this workflow will fail at the deploy step, which is expected.

on:
  push:
    tags:
      - 'wp-*'

jobs:
  deploy:
    name: Deploy to WordPress.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Assemble a clean plugin folder (only shipped files) for SVN trunk.
      - name: Build clean plugin directory
        run: |
          mkdir -p build/zinejs
          rsync -a \
            --exclude '.git' --exclude '.gitignore' --exclude '.wp-env.json' \
            --exclude '.distignore' --exclude 'README.md' --exclude 'bin' \
            --exclude 'dist' --exclude '.wordpress-org' --exclude 'node_modules' \
            integrations/wordpress/ build/zinejs/

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#wp-}" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: zinejs
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_DIR: ${{ github.workspace }}/build/zinejs
          ASSETS_DIR: ${{ github.workspace }}/integrations/wordpress/.wordpress-org
