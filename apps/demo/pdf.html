<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zinejs — PDF</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #16161d;
        color: #eaeaf0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 28px;
      }
      #book {
        width: 900px;
        height: 560px;
        max-width: 96vw;
        background: #0c0c11;
        border-radius: 4px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        touch-action: none;
        user-select: none;
      }
      a {
        color: #8ab4ff;
      }
      .hint {
        opacity: 0.6;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>zinejs — PDF</h1>
    <div id="book"></div>
    <p class="hint">Drag a page corner (or click near an edge) to flip · double-click / Ctrl+wheel / pinch to zoom.</p>
    <p><a href="/">← View the image demo</a></p>
    <script type="module" src="/src/pdf.ts"></script>
  </body>
</html>
